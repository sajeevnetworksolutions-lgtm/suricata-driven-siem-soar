services:
  # =========================================================================
  # 1. SIEM Log Storage & Search: Elasticsearch
  # =========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: siem-elasticsearch
    environment:
      - node.name=siem-es-01
      - cluster.name=suricata-siem-cluster
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - siem_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health | grep -q green || curl -s http://localhost:9200/_cat/health | grep -q yellow"]
      interval: 10s
      timeout: 10s
      retries: 10

  # =========================================================================
  # 2. SOC Analytics & Dashboards: Kibana
  # =========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: siem-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana.siem.local
    ports:
      - "5601:5601"
    networks:
      - siem_net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # =========================================================================
  # 3. Network Intrusion Detection Engine: Suricata IDS
  # =========================================================================
  suricata:
    image: jasonish/suricata:7.0
    container_name: siem-suricata
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command: -i eth0 -k none -c /etc/suricata/suricata.yaml -v
    volumes:
      - ./config/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./config/suricata/rules:/var/lib/suricata/rules:ro
      - suricata_logs:/var/log/suricata
    networks:
      siem_net:
        aliases:
          - ids.sensor.local
    restart: unless-stopped

  # =========================================================================
  # 4. Log Shipper & ECS Normalizer: Filebeat
  # =========================================================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: siem-filebeat
    user: root
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_HOST=http://kibana:5601
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - suricata_logs:/var/log/suricata:ro
    networks:
      - siem_net
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # 5. SOAR Automated Incident Response Engine & Dashboard
  # =========================================================================
  soar-engine:
    build:
      context: ./soar_engine
      dockerfile: Dockerfile
    container_name: siem-soar-engine
    environment:
      - EVE_LOG_PATH=/var/log/suricata/eve.json
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - AUTO_BAN_ENABLED=true
      - BAN_THRESHOLD_SEVERITY=1
      - BAN_TTL_SECONDS=300
      - SLACK_WEBHOOK_URL=
      - DISCORD_WEBHOOK_URL=
      - VIRUSTOTAL_API_KEY=
      - ABUSEIPDB_API_KEY=
    ports:
      - "8000:8000"
    volumes:
      - suricata_logs:/var/log/suricata:ro
      - ./soar_engine/data:/app/data
    networks:
      - siem_net
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # 6. Target Testbed for Attack Scenarios
  # =========================================================================
  vulnerable-target:
    build:
      context: ./target_service
      dockerfile: Dockerfile
    container_name: siem-target-app
    environment:
      - TARGET_PORT=80
      - SOAR_URL=http://soar-engine:8000
    ports:
      - "8080:80"
      - "2222:22"
    networks:
      siem_net:
        aliases:
          - target.corp.local
    restart: unless-stopped

networks:
  siem_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  es_data:
    driver: local
  suricata_logs:
    driver: local
